# Catálogo de vias (onde o modelo roda) e modelos (variáveis de análise).
#
# Campos marcados "# conferir" vieram de memória e precisam ser confirmados na fonte oficial
# antes da análise final (data de lançamento e corte de conhecimento entram em P5 e P7).
# `uv run iac vias` lista os modelos que cada via realmente oferece hoje.
#
# Cotas gratuitas mudam com frequência: `rpm`/`rpd` aqui são TETOS que nós nos impomos,
# abaixo do limite publicado. O executor também para ao receber 429 de cota diária.

# ------------------------------------------------------------------ orçamento
# Teto absoluto do projeto (decisão do usuário: zero como meta, US$ 30 como limite). O executor soma
# todas as vias pagas e reserva o pior caso ANTES de cada chamada. Configure também o mesmo limite
# como "hard limit" no painel de cada provedor pago (segunda trava, independente do código).
[orcamento]
teto_global_usd = 30.0

# ------------------------------------------------------------------ vias
# treina_com_dados: política declarada da via para o plano usado (conferir nos termos vigentes).
# logprobs: a via devolve a probabilidade dos tokens (probabilidade interna da letra escolhida).

[vias.ollama]
base_url = "http://localhost:11434/v1"
chave_env = ""            # local, sem chave
rpm = 0                   # 0 = sem limite
rpd = 0
json_mode = true
paga = false
treina_com_dados = false
logprobs = true

[vias.groq]
base_url = "https://api.groq.com/openai/v1"
chave_env = "GROQ_API_KEY"
rpm = 25
rpd = 900
tpd = 400000              # Groq limita tokens/dia por modelo; medir no piloto e ajustar
json_mode = true
paga = false
treina_com_dados = false  # conferir termos vigentes

[vias.gemini]
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
chave_env = "GEMINI_API_KEY"
rpm = 8
rpd = 200
aceita_seed = false       # HTTP 400 "Unknown name seed" (15/10/2026)
json_mode = true
paga = false
treina_com_dados = true   # nível gratuito da Gemini API usa os dados para melhorar produtos

[vias.openrouter]
base_url = "https://openrouter.ai/api/v1"
chave_env = "OPENROUTER_API_KEY"
rpm = 15
rpd = 45
json_mode = false         # nem todo modelo :free aceita response_format
paga = false
treina_com_dados = true   # depende do provedor por trás do :free; tratar como sim

[vias.openai]
base_url = "https://api.openai.com/v1"
chave_env = "OPENAI_API_KEY"
rpm = 60
rpd = 0
json_mode = true
paga = true
teto_usd = 4.8            # P1: depósito de US$ 5 (plano em patamares de 15/10); margem para arredondamento
treina_com_dados = false  # API da OpenAI não treina com dados por padrão
logprobs = true

