[project]
name = "iac"
version = "0.1.0"
description = "Comportamento de LLMs em questões de concursos públicos brasileiros"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "pymupdf>=1.28.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
iac = "iac.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
